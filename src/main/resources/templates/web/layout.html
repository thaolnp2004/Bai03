<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <meta charset="UTF-8">
    <title>Hệ Thống Quản Lý</title>
    <!-- Nhúng Bootstrap 5 CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <!-- Nhúng Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
</head>
<body>

    <!-- THANH ĐIỀU HƯỚNG MÀU VÀNG/CAM -->
    <nav class="navbar navbar-expand-lg navbar-light bg-warning mb-4 shadow-sm">
        <div class="container-fluid justify-content-between">
            <!-- Nút Quản lý Sinh viên (Bên trái) -->
            <a class="btn btn-danger fw-bold text-white" th:href="@{/sinhvien}">
                <i class="bi bi-person-badge"></i> Quản Lý Sinh Viên
            </a>
            
            <!-- Nhóm nút bên phải: Quản lý Sản phẩm và Nhập sinh viên -->
            <div>
                <a class="btn btn-dark fw-bold text-white me-2" th:href="@{/products}">
                    <i class="bi bi-box-seam"></i> Quản Lý Sản Phẩm
                </a>
                <a class="btn btn-warning border fw-bold text-dark bg-white" th:href="@{/sinhvien/add}">
                    <i class="bi bi-plus-circle"></i> + Nhập Sinh Viên
                </a>
            </div>
        </div>
    </nav>

    <!-- Khu vực hiển thị nội dung động của các trang con -->
    <div class="container">
        <section layout:fragment="content">
            <!-- Nội dung thay đổi sẽ đổ vào đây -->
        </section>
    </div>

    <!-- Nhúng Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
